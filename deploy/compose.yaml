name: 3dmidi
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: 3dmidi-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MIDI_ALLOWED_HOSTS: ${MIDI_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MIDI_SITE_NAME: 3DMidi
      MIDI_PROXY_MODE: ${MIDI_PROXY_MODE:-cloudflare}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    pids_limit: 96
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).close()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  preview:
    image: cloudflare/cloudflared:latest
    profiles: [preview]
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
    command: [tunnel, --no-autoupdate, --url, "http://web:8765"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/cloudflare_tunnel_token]
    secrets: [cloudflare_tunnel_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
