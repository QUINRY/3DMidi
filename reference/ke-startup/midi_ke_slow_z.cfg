# Ender-3 V3 KE only. Include once in printer.cfg, then FIRMWARE_RESTART.
# Bounds the stock homing macro's direct Z FORCE_MOVE hop as well.
# Does not change the hop distance, endstop logic or kinematic position.
# Do not install if another FORCE_MOVE override already exists.
[gcode_macro FORCE_MOVE]
rename_existing: FORCE_MOVE_BASE
description: Preserve FORCE_MOVE while limiting direct Z moves to 3 mm/s
gcode:
  {% if params.STEPPER|default('') == 'stepper_z' %}
    {% set velocity = [params.VELOCITY|float, 3.0]|min %}
    {% set requested_accel = params.ACCEL|default(0)|float %}
    {% set accel = 100.0 if requested_accel == 0 else [requested_accel, 100.0]|min %}
    FORCE_MOVE_BASE STEPPER=stepper_z DISTANCE={params.DISTANCE} VELOCITY={velocity} ACCEL={accel}
  {% else %}
    FORCE_MOVE_BASE {rawparams}
  {% endif %}
